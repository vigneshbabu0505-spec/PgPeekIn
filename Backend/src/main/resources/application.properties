spring.application.name=Backend
server.port=8080

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=25
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=8000
spring.datasource.hikari.initialization-fail-timeout=8000
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_schema=pgpeekin
logging.level.org.springframework.security=DEBUG
supabase.url=${SUPABASE_URL}
supabase.bucket=${SUPABASE_BUCKET}
supabase.key=${SUPABASE_KEY}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=30MB

server.tomcat.max-http-form-post-size=30MB
server.tomcat.max-swallow-size=30MB

jwt.secret=${JWT_SECRET}

# Multiple PG photo upload settings
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB




